# Generates ABetterVoice.xcodeproj: `brew install xcodegen && xcodegen generate`
name: ABetterVoice
options:
  bundleIdPrefix: app.abettervoice
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: en
    CODE_SIGN_STYLE: Automatic
    # Set your team here, or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  VoiceEnhancerCore:
    path: Packages/VoiceEnhancerCore

targets:
  ABetterVoice-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: VoiceEnhancerCore
        product: VoiceEnhancerCore
    settings:
      base:
        PRODUCT_NAME: A Better Voice
        PRODUCT_MODULE_NAME: ABetterVoice
        PRODUCT_BUNDLE_IDENTIFIER: app.abettervoice.ABetterVoice
        INFOPLIST_FILE: App/Support/iOS-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  ABetterVoice-macOS:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/Resources
    dependencies:
      - package: VoiceEnhancerCore
        product: VoiceEnhancerCore
    settings:
      base:
        PRODUCT_NAME: A Better Voice
        PRODUCT_MODULE_NAME: ABetterVoice
        PRODUCT_BUNDLE_IDENTIFIER: app.abettervoice.ABetterVoice
        INFOPLIST_FILE: App/Support/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Lets the app run locally without a developer team.
        CODE_SIGN_IDENTITY: "-"

# Run in Release: the audio processing is pure Swift and is many times slower unoptimised.
schemes:
  ABetterVoice-iOS:
    build:
      targets:
        ABetterVoice-iOS: all
    run:
      config: Release
    archive:
      config: Release
  ABetterVoice-macOS:
    build:
      targets:
        ABetterVoice-macOS: all
    run:
      config: Release
    archive:
      config: Release
